name: llm-oauth

services:
  agentgateway:
    image: cr.agentgateway.dev/agentgateway:v1.5.0
    restart: unless-stopped
    command: ["-f", "/etc/agentgateway.yaml"]
    configs:
      - source: agentgateway
        target: /etc/agentgateway.yaml
    ports:
      - "127.0.0.1:4000:4000"

  openwebui:
    image: ghcr.io/open-webui/open-webui:v0.11.3
    restart: unless-stopped
    depends_on:
      - agentgateway
    ports:
      - "127.0.0.1:3000:8080"
    volumes:
      - openwebui-data:/app/backend/data
    environment:
      WEBUI_URL: "http://localhost:3000"
      WEBUI_SECRET_KEY: "${WEBUI_SECRET_KEY:-REPLACE_WITH_RANDOM_SECRET}"
      ENABLE_PERSISTENT_CONFIG: "false"
      WEBUI_AUTH: "true"
      ENABLE_LOGIN_FORM: "false"
      ENABLE_PASSWORD_AUTH: "false"
      ENABLE_SIGNUP: "false"
      ENABLE_OAUTH_SIGNUP: "true"
      DEFAULT_USER_ROLE: "user"
      OAUTH_MERGE_ACCOUNTS_BY_EMAIL: "false"
      OAUTH_PROVIDER_NAME: "Entra"
      OAUTH_CLIENT_ID: "${WEBUI_CLIENT_ID:-REPLACE_WITH_WEBUI_CLIENT_ID}"
      OAUTH_CLIENT_SECRET: "${WEBUI_CLIENT_SECRET:-REPLACE_WITH_WEBUI_CLIENT_SECRET}"
      OPENID_PROVIDER_URL: "https://login.microsoftonline.com/${ENTRA_TENANT_ID:-REPLACE_WITH_TENANT_ID}/v2.0/.well-known/openid-configuration"
      OPENID_REDIRECT_URI: "http://localhost:3000/oauth/oidc/callback"
      OAUTH_SCOPES: "openid profile email offline_access api://${GATEWAY_APP_ID:-REPLACE_WITH_GATEWAY_APP_ID}/llm.invoke"
      OAUTH_CODE_CHALLENGE_METHOD: "S256"
      OAUTH_TOKEN_ENDPOINT_AUTH_METHOD: "client_secret_post"
      OAUTH_EMAIL_CLAIM: "email"
      OAUTH_USERNAME_CLAIM: "name"
      OAUTH_PICTURE_CLAIM: ""
      ENABLE_OLLAMA_API: "false"
      ENABLE_OPENAI_API: "true"
      OPENAI_API_BASE_URLS: "http://agentgateway:4000/v1"
      OPENAI_API_KEYS: ""
      OPENAI_API_CONFIGS: >-
        {"0":{"enable":true,"auth_type":"system_oauth","model_ids":["llm"]}}

configs:
  agentgateway:
    content: |
      llm:
        port: 4000
        policies:
          jwtAuth:
            mode: strict
            issuer: "https://login.microsoftonline.com/${ENTRA_TENANT_ID:-REPLACE_WITH_TENANT_ID}/v2.0"
            audiences:
              - "${GATEWAY_APP_ID:-REPLACE_WITH_GATEWAY_APP_ID}"
            jwks:
              url: "https://login.microsoftonline.com/${ENTRA_TENANT_ID:-REPLACE_WITH_TENANT_ID}/discovery/v2.0/keys"
          authorization:
            rules:
              - allow: 'has(jwt.scp) && "llm.invoke" in jwt.scp.split(" ")'
        models:
          - name: llm
            provider: openAI
            requestHeaders:
              remove: [cookie]
            params:
              model: "${UPSTREAM_MODEL:-REPLACE_WITH_UPSTREAM_MODEL}"
              baseUrl: "${UPSTREAM_BASE_URL:-http://REPLACE_WITH_LLM_HOST:8000/v1}"
              apiKey: "${UPSTREAM_API_KEY:-}"

volumes:
  openwebui-data:
