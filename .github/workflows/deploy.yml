name: Deploy

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Commit or ref to deploy from main
        required: false
        default: main

concurrency:
  group: llm-oauth-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out requested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0

      - name: Require a revision reachable from main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main || {
            echo 'The requested revision is not reachable from main.' >&2
            exit 1
          }
          echo "DEPLOY_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install cloudflared
        run: |
          curl --fail --silent --show-error --location --retry 5 \
            --output "$RUNNER_TEMP/cloudflared.deb" \
            https://github.com/cloudflare/cloudflared/releases/download/2026.9.1/cloudflared-linux-amd64.deb
          printf '%s  %s\n' '3be76adc4185d36a0bfb4c2dd8663292f0ed363797f2180333b513b43c81d419' "$RUNNER_TEMP/cloudflared.deb" | sha256sum --check --status
          sudo dpkg --install "$RUNNER_TEMP/cloudflared.deb"

      - name: Prepare SSH credentials
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_HOST_KEY: ${{ secrets.DEPLOY_SSH_HOST_KEY }}
        run: |
          umask 077
          install -m 700 -d "$RUNNER_TEMP/llm-oauth"
          : "${DEPLOY_SSH_PRIVATE_KEY:?Missing deployment private key}" "${DEPLOY_SSH_HOST_KEY:?Missing SSH host key}"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/llm-oauth/deploy.key"
          printf '%s\n' "$DEPLOY_SSH_HOST_KEY" > "$RUNNER_TEMP/llm-oauth/known_hosts"
          ssh-keygen -y -f "$RUNNER_TEMP/llm-oauth/deploy.key" >/dev/null
          ssh-keygen -lf "$RUNNER_TEMP/llm-oauth/known_hosts" >/dev/null

      - name: Open and verify Cloudflare Access SSH tunnel
        env:
          ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          : "${ACCESS_CLIENT_ID:?Missing Access client ID}" "${ACCESS_CLIENT_SECRET:?Missing Access client secret}" "${DEPLOY_HOST:?Missing deploy hostname}"
          cloudflared access tcp --hostname "$DEPLOY_HOST" \
            --id "$ACCESS_CLIENT_ID" --secret "$ACCESS_CLIENT_SECRET" \
            --url 127.0.0.1:2222 >"$RUNNER_TEMP/llm-oauth/cloudflared.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/llm-oauth/cloudflared.pid"
          for _ in $(seq 1 30); do
            kill -0 "$(cat "$RUNNER_TEMP/llm-oauth/cloudflared.pid")" || exit 1
            if ssh -p 2222 -o BatchMode=yes -o ConnectTimeout=5 \
              -o UserKnownHostsFile="$RUNNER_TEMP/llm-oauth/known_hosts" \
              -o StrictHostKeyChecking=yes -i "$RUNNER_TEMP/llm-oauth/deploy.key" \
              deploy@127.0.0.1 'sudo test -f /var/lib/llm-oauth-bootstrap-complete && sudo systemctl is-active --quiet docker cloudflared'; then exit 0; fi
            sleep 2
          done
          echo 'Authenticated SSH/bootstrap check failed.' >&2
          exit 1

      - name: Deploy Compose configuration
        env:
          ENTRA_TENANT_ID: ${{ secrets.ENTRA_TENANT_ID }}
          GATEWAY_APP_ID: ${{ secrets.GATEWAY_APP_ID }}
          WEBUI_CLIENT_ID: ${{ secrets.WEBUI_CLIENT_ID }}
          WEBUI_CLIENT_SECRET: ${{ secrets.WEBUI_CLIENT_SECRET }}
          WEBUI_SECRET_KEY: ${{ secrets.WEBUI_SECRET_KEY }}
          UPSTREAM_API_KEY: ${{ secrets.UPSTREAM_API_KEY }}
          UPSTREAM_MODEL: ${{ vars.UPSTREAM_MODEL }}
          UPSTREAM_BASE_URL: ${{ vars.UPSTREAM_BASE_URL }}
          WEBUI_URL: ${{ vars.WEBUI_URL }}
          OPENID_REDIRECT_URI: ${{ vars.OPENID_REDIRECT_URI }}
        run: |
          set -euo pipefail
          umask 077
          bundle="$RUNNER_TEMP/llm-oauth/bundle"
          install -m 700 -d "$bundle"
          python3 scripts/write-deploy-env.py "$bundle/.env"
          ssh_options=(-p 2222 -o BatchMode=yes -o ConnectTimeout=10 -o "UserKnownHostsFile=$RUNNER_TEMP/llm-oauth/known_hosts" -o StrictHostKeyChecking=yes -i "$RUNNER_TEMP/llm-oauth/deploy.key")
          stage=$(ssh "${ssh_options[@]}" deploy@127.0.0.1 'umask 077; mktemp -d /tmp/llm-oauth-deploy.XXXXXXXX')
          [[ $stage =~ ^/tmp/llm-oauth-deploy\.[a-zA-Z0-9]+$ ]] || exit 1
          # stage is generated by mktemp and restricted to a safe path above.
          trap 'ssh "${ssh_options[@]}" deploy@127.0.0.1 "rm -rf -- $stage" || true' EXIT
          scp -P 2222 -o BatchMode=yes -o "UserKnownHostsFile=$RUNNER_TEMP/llm-oauth/known_hosts" \
            -o StrictHostKeyChecking=yes -i "$RUNNER_TEMP/llm-oauth/deploy.key" \
            compose.yaml compose.production.yaml "$bundle/.env" "deploy@127.0.0.1:$stage/"
          # Pass the locally resolved revision and validated staging path.
          # shellcheck disable=SC2029
          ssh "${ssh_options[@]}" deploy@127.0.0.1 \
            "bash -s -- '$stage' '$DEPLOY_COMMIT' '$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT'" < scripts/deploy-remote.sh

      - name: Clean up deployment credentials and tunnel
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/llm-oauth/cloudflared.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/llm-oauth/cloudflared.pid")" || true
          fi
          rm -rf "$RUNNER_TEMP/llm-oauth" "$RUNNER_TEMP/cloudflared.deb"
