name: Check
on:
  pull_request:
  push:
    branches: [main, feature/entra-oauth-compose]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell and exercise provisioning and deployment failures
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          shellcheck scripts/*.sh
          python3 -m unittest discover -s tests -v
